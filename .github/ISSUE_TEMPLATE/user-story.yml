name: Historia de usuario
description: Funcionalidad desde la mirada del usuario
title: "[HU] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Repo público.** No escribas nombres, RUT, direcciones, patentes, IPs, números de serie, credenciales ni capturas con datos del cliente. Usa placeholders."
  - type: textarea
    id: story
    attributes:
      label: Historia
      placeholder: "Como <rol>, quiero <acción>, para <beneficio>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] Dado..., cuando..., entonces..."
    validations:
      required: true
  - type: input
    id: odd_metric
    attributes:
      label: Métrica ODD
      description: "¿Qué métrica mueve este issue? Ej.: p90 ciclo de salida (R1), % validación 1er intento, eventos perdidos = 0"
    validations:
      required: true
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options: ["S1", "S2", "S3", "Sin asignar"]
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Rol responsable (se aplica como label role:*)
      options: ["Fullstack", "LorenaMarketing", "QA", "SalesforceDeveloper", "IntegrationAutomationArchitect"]
    validations:
      required: true
  - type: checkboxes
    id: offline
    attributes:
      label: Operación offline
      options:
        - label: "Esta historia debe funcionar sin internet (agregar label offline)"
  - type: textarea
    id: notes
    attributes:
      label: Notas / referencia al Product Backlog
